name: "Import Compatibility Report"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  import-report:
    # Run if issue is opened with 'compatibility' label, or when labeled with 'compatibility' or 'import-report'
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'compatibility')) ||
      (github.event.action == 'labeled' && (github.event.label.name == 'compatibility' || github.event.label.name == 'import-report'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse and Import Compatibility Report
        id: import_step
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python3 .github/scripts/import_compatibility_report.py

      - name: Commit and Push Updated COMPATIBILITY.md
        id: commit_step
        run: |
          if git diff --quiet COMPATIBILITY.md; then
            echo "No changes detected in COMPATIBILITY.md."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in COMPATIBILITY.md. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add COMPATIBILITY.md
            git commit -m "Auto-import compatibility report from #${{ github.event.issue.number }} [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Comment and Label to Issue
        if: steps.commit_step.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "🎉 **Thank you!** Your compatibility report has been automatically processed and added to [COMPATIBILITY.md](https://github.com/vrwindsor1/Universal_MotCamera4Suite_Installer/blob/main/COMPATIBILITY.md)."
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["imported"]
            });
